name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same branch supersedes an in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    # Its own budget, back at the original 15: the Chromium download and the
    # apt-get dependency install that forced the raise to 25 now live in the
    # separate `e2e` job, which runs concurrently rather than in series.
    timeout-minutes: 15
    env:
      # Vitest/Next must behave as they do on a headless runner, and no TTY may be
      # required. No repository secrets are used by this workflow, so it passes on
      # a fork PR.
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # `--frozen-lockfile` rejects a STALE lockfile, but in bun 1.3.x it exits 0
      # when bun.lock is absent entirely and silently resolves from the registry.
      # Guard the missing case here so a deleted lockfile is a red, legible build
      # instead of a green one that installed whatever the network served that day.
      - name: Verify lockfile is committed
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error::bun.lock is missing from the repository. Run 'bun install' and commit the lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `prettier --check` is the only gate here that reads .md, .yml, .json and
      # .css. Lint is `eslint .` over TypeScript, so a file carrying unresolved
      # merge-conflict markers passes lint, typecheck, test and build. Run it
      # first among the quality gates so a formatting/conflict-marker failure is
      # reported as itself rather than buried behind a later step. This step
      # REPORTS only — never --write/--fix, so CI can never mutate the tree.
      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # FINDING 3 (B27) — the migration-drift control.
      #
      # WHY THIS STEP EXISTS. `canonical_events.type` is constrained by a CHECK
      # whose allowed values are generated from `CANONICAL_EVENT_TYPES`
      # (db/schema.ts). "Generated" is only true AT GENERATION TIME: the
      # committed migration inlines static SQL literals
      # (db/migrations/0001_parched_talon.sql), so adding a member to
      # CANONICAL_EVENT_TYPES without running `bun run db:generate` ships a
      # database whose CHECK rejects the new value at insert time.
      #
      # WHY NOTHING ELSE CAUGHT IT. `bun run test` collects `src/**` only
      # (vitest.config.ts:17), so the db suite is invisible to it; that suite
      # needs a live Postgres, which this job does not have. Lint and typecheck
      # cannot see it either — the drift exists only in a generated .sql file.
      # So until this step, the schema comment's claim that "the constraint
      # cannot silently drift from the TypeScript union" was an UNENFORCED
      # assertion that could rot silently.
      #
      # `db:generate` is a purely offline operation (drizzle.config.ts reads
      # schema files and diffs them), so this needs no database service. It runs
      # AFTER format:check because drizzle-kit rewrites files; this step must
      # REPORTS a dirty tree, never commit it.
      - name: Database migrations in sync
        run: |
          bun run db:generate
          # Any diff here means db/schema.ts and db/migrations disagree. The
          # generated files are NOT restored: leaving them visible makes the
          # failure debuggable from the log, and the job is ephemeral.
          if ! git diff --exit-code -- db/migrations; then
            echo "::error::db/migrations is out of sync with db/schema.ts. Run 'bun run db:generate' and commit the result. A schema change that was not regenerated ships a CHECK constraint whose value list no longer matches CANONICAL_EVENT_TYPES."
            exit 1
          fi
          if [ -n "$(git status --porcelain -- db/migrations)" ]; then
            echo "::error::bun run db:generate created NEW untracked files under db/migrations (see the list below). Commit them."
            git status --porcelain -- db/migrations
            exit 1
          fi

      - name: Build
        run: bun run build

  # A separate job, not more steps in `verify`, so a red e2e is its own named
  # check in the PR checks list and can be told apart from a red unit test
  # without opening a log. There is deliberately no dependency edge on
  # `verify`: that would serialise the two jobs and reintroduce exactly the
  # coupling this split exists to remove. Both jobs run concurrently on their
  # own runners and report independent status and independent timing.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Larger than `verify`'s 15 because this job carries the apt-get system
    # dependency install and the ~170 MB Chromium download on top of install
    # and build.
    timeout-minutes: 25
    env:
      # GitHub Actions already exports `CI=true` into every step, so this
      # declaration is explicit documentation and robustness, not a behavioural
      # requirement: removing it would not change what Playwright sees here.
      # It is worth stating anyway, because playwright.config.ts does read
      # `process.env.CI` — lines 12-14 and 32 — to select retries=2, forbidOnly,
      # the line reporter and reuseExistingServer:false. Declaring the value we
      # depend on at the job level means the intent survives a runner-default
      # change or a future job that opts out, and it keeps the e2e mode pinned
      # to the one B16 proved on a real runner.
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Same guard as `verify`, for the same reason: bun 1.3.x
      # `--frozen-lockfile` exits 0 when bun.lock is absent entirely and
      # silently resolves from the registry instead. Without this step here, a
      # PR that deleted the lockfile would still get a green `e2e`.
      - name: Verify lockfile is committed
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error::bun.lock is missing from the repository. Run 'bun install' and commit the lockfile."
            exit 1
          fi

      # Dependencies are re-installed here rather than carried over from
      # `verify` as a build artifact: the round-trip would add a second large
      # transfer and a new failure mode to the critical path, and buys little
      # against the Chromium download.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build is re-run here rather than handed over as an artifact, because
      # playwright.config.ts webServer runs `bun run start` (next start), which
      # serves the .next/ output. The Build step inside `verify` runs
      # concurrently and produces nothing this job can consume. This is also why
      # the e2e steps below must come AFTER this Build step, never before it.
      - name: Build
        run: bun run build

      # ── e2e ──────────────────────────────────────────────────────────────────
      # Everything below runs the Playwright suite for real, in this job, so
      # when it goes red the PR checks list says e2e failed rather than naming
      # six other gates that passed.
      #
      # `--with-deps` is deliberate and NOT optional. A GitHub runner has no
      # Chromium and none of the shared libraries Chromium dlopen()s at startup
      # (libnss3, libatk-1.0, libgbm, libasound2, the X11/i18n/gtk family). The
      # plain `playwright install chromium` only downloads the browser; the first
      # launch then dies with "error while loading shared libraries". On
      # ubuntu-latest the deps install is the single most common reason this
      # step fails, so it is provisioned up front rather than discovered.
      # `playwright install --with-deps` == install browser + `playwright
      # install-deps`, i.e. an apt-get run of Playwright's own pinned package
      # list; it is not the same thing as Playwright's docker image.
      - name: Install Chromium and its system dependencies
        run: bunx playwright install --with-deps chromium

      # `bun run e2e` = `playwright test`. playwright.config.ts already pins
      # everything a headless runner needs, so this is a plain invocation:
      #   - CI:true is set at job level, so retries=2, forbidOnly, line reporter
      #     and reuseExistingServer:false all take effect.
      #   - webServer.command is `bun run start` (next start), which serves the
      #     .next/ output produced by the Build step above — hence e2e must run
      #     AFTER build, never before it. Playwright polls http://127.0.0.1:3000
      #     and only starts the server itself because reuseExistingServer is
      #     false under CI.
      #   - The chromium project uses the bundled channel-less Chrome build and
      #     runs headless by default, identical to local behaviour.
      # No secrets: the specs are local-only and the server needs no database or
      # credential provider.
      - name: E2E (Playwright)
        run: bun run e2e

  # T14 — the missing runner for the DB round-trip suite.
  #
  # WHY THIS JOB EXISTS. `db/__tests__/canonical-events-persistence.test.ts`
  # is collected ONLY by `vitest.db.config.ts`
  # (`include: ["db/**/__tests__/**/*.test.ts"]`), which `bun run test` never
  # loads — `vitest.config.ts:17` matches `src/**` and `e2e/**` only. Until this
  # job, that suite was written, reviewed, merged and executed by NOTHING: a
  # green `verify` check proved nothing at all about persistence.
  #
  # No line count is quoted here on purpose. A hard-coded figure in an explanatory
  # comment goes stale the moment the suite grows, and a stale figure is worse
  # than none: the comment below the first version of this job claimed "401
  # lines" while the file was already 518, which is a claim no assertion backs.
  # If you want the size, measure it (`wc -l`) rather than reading it here.
  #
  # WHY A SEPARATE JOB, NOT MORE STEPS IN `verify`. Three reasons, in order of
  # weight: (1) a red round trip must be a NAMED check, so the PR checks list
  # says `db round trip` rather than hiding a Postgres failure inside the
  # aggregate; (2) `verify` needs no database, so adding a service container
  # would put a database in the path of every unit test for no reason; (3) the
  # suite is deliberately not skip-safe (vitest.db.setup.ts throws when
  # DATABASE_URL is unset), so it must own a job that guarantees a database —
  # there is no configuration of `verify` in which it is safely runnable.
  # There is deliberately no `needs:` edge on `verify`, matching `e2e`: all three
  # jobs are independent and run concurrently on their own runners.
  db:
    name: db round trip
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: "1"
      # The credential pair below is a THROWAWAY for the ephemeral service
      # container declared in `services:` below. It is not a credential for any
      # real host: the container is created fresh for this job, reachable only
      # on the runner's loopback via the published port, and destroyed with the
      # job. This string is never printed — `bun run db:check` prints only the
      # result of `SELECT 1`, and no step echoes this variable. Do not replace
      # it with a real host, and do not move it into a repository secret: a
      # secret here would be strictly worse (fork PRs could not run the job, and
      # it would be a real credential in a place a real credential belongs).
      # `sslmode=disable` is stated explicitly because the service has no TLS and
      # an explicit setting removes the question; it does NOT match a flag in
      # `.env.example`, which carries no `sslmode` (that file is
      # `postgresql://USER:PASSWORD@localhost:5432/devloop` and nothing more).
      # An earlier version of this comment claimed the two matched, which was
      # false — a maintainer reading it would look for a flag that is not there.
      DATABASE_URL: postgresql://devloop:devloop@127.0.0.1:5432/devloop?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Same throwaway pair as DATABASE_URL above. `POSTGRES_DB` names the
          # database created at first boot; the health check below is what the
          # job waits on, so steps cannot race an initialising server.
          POSTGRES_USER: devloop
          POSTGRES_PASSWORD: devloop
          POSTGRES_DB: devloop
        ports:
          # 5432:5432 — GitHub-hosted runners have nothing on 5432, so the
          # service port maps to the same number and the URL above reads as it
          # would locally.
          - 5432:5432
        # Without these options a step can connect in the window where the
        # container is running but initdb has not finished, and the resulting
        # error ("the database system is starting up") looks like a code defect
        # instead of a race. With them, GitHub holds the job until the server
        # genuinely accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      # Same guard as `verify` and `e2e`, for the same reason: bun 1.3.x
      # `--frozen-lockfile` exits 0 when bun.lock is absent entirely and
      # resolves from the registry instead, which would let a PR that deleted
      # the lockfile report a green `db round trip`.
      - name: Verify lockfile is committed
        run: |
          if [ ! -f bun.lock ]; then
            echo "::error::bun.lock is missing from the repository. Run 'bun install' and commit the lockfile."
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Server-side reachability, before anything that depends on the schema.
      # This asserts the service is genuinely usable (not merely that a TCP
      # port is open) and is the first place a provisioning problem is
      # reported as itself. It prints `SELECT 1 => 1` and never the URL.
      - name: Check database connection
        run: bun run db:check

      # The suite inserts real rows into a real table with real constraints, so
      # the schema must exist before it runs. `db:migrate` is idempotent (it
      # applies only the migrations not yet recorded), and against a fresh
      # ephemeral service it applies all of them.
      - name: Apply migrations
        run: bun run db:migrate

      # THE step this job exists for. Deliberately not `bun run test`: that
      # config does not collect `db/**`, and adding the directory to it would
      # make every developer without a database see a red default suite.
      #
      # It IS, however, now the only place the upsert proof
      # (`src/app/sources/__tests__/persist-canonical-events-upsert.test.ts`)
      # actually executes. That file lives under `src/**`, so the default suite
      # collects it — but this job is the one with a database, and the `verify`
      # job has none, so its `describeWithDb` collapsed to `describe.skip` there
      # and every assertion was reported skipped inside a green run.
      # `vitest.db.config.ts` names the file explicitly for that reason. Verify a
      # change to it with a deliberate RED: break one assertion, confirm this job
      # goes red, restore, confirm green. A green `db round trip` on its own
      # cannot distinguish "collected and passing" from "collected and skipped".
      #
      # It is ALSO, since B37 (t_8c73ba34), the only place
      # `src/lib/db/__tests__/client.test.ts` executes for real. That file's three
      # `describeWithDb` assertions — including "round-trips a row through the
      # migrated table", the only assertion in the repository that the shipped
      # `db/migrations` yield a usable table — were collected by
      # `vitest.config.ts` and reported SKIPPED in `verify`, which has no
      # database. Same shape as B35's defect one commit earlier, and the same
      # remedy: name the file in `vitest.db.config.ts`.
      #
      # DO NOT EXTEND THIS BY HAND AND TRUST IT. `src/__tests__/db-suite-registry.test.ts`
      # runs in the DEFAULT `verify` suite and fails if any `*.test.ts` under
      # `src/**` requires a database and is not named in that config's `include`
      # list — so forgetting is a red `verify`, not a green lie.
      - name: DB round-trip tests
        run: bun run test:db
